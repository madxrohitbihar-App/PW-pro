<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Wallah</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            position: relative;
        }
        /* Top Branding Header - Website ke theme color se match karta hua */
        .top-header {
            background: #ffffff;
            color: #000000;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            min-height: 65px;
            flex-shrink: 0;
            z-index: 100;
        }
        .brand-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
        }
        .brand-text h1 {
            font-size: 18px;
            color: #0f172a;
            font-weight: 700;
        }
        .developer-credit {
            font-size: 10px;
            color: #64748b;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
        /* Iframe Container */
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: calc(100% + 65px);
            margin-top: -65px;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Custom Header -->
        <header class="top-header">
            <div class="brand-info">
                <img src="https://i.postimg.cc/2yf3sPqb/IMG-20260731-232914-129.jpg" alt="Logo">
                <div class="brand-text">
                    <h1>Physics Wallah</h1>
                    <div class="developer-credit">Developer By MedxrohitBihar</div>
                </div>
            </div>
        </header>

        <!-- Main Proxy Website Area -->
        <div class="iframe-container">
            <iframe src="https://pw.studyparcham.in/#home-view" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
